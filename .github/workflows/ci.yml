name: AI Financial Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Python syntax
        run: python -m compileall -q app tests

      - name: Ruff
        run: ruff check app tests

      - name: Tests
        run: pytest -q

      - name: Flask smoke test
        run: |
          cd app
          python - <<'PY'
          from web_app import app
          client = app.test_client()
          response = client.get("/")
          assert response.status_code < 500
          PY

      - name: Portfolio documentation
        run: |
          for file in README.md README.en.md README.es.md; do
            test -s "$file"
            grep -q "Filipe G Morais" "$file"
            grep -q "github.com/sayjinblackbelt" "$file"
          done

      - name: Secret pattern check
        run: |
          if grep -RInE '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' . --exclude-dir=.git; then
            echo "Potential secret detected."
            exit 1
          fi
